name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - name: Unit tests, lint, release build (unsigned)
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease -Punsigned
      - name: No internet permission, ever
        run: |
          m=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml | head -1)
          echo "Checking $m"
          if grep -q 'android.permission.INTERNET' "$m"; then echo "INTERNET permission found"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: clipshot-unsigned
          path: app/build/outputs/apk/release/*.apk
